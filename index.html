<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{name}}</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }

body {
  width: 100vw;
  height: 100vh;
  overflow: hidden;
  background: #0a0e14;
  display: flex;
  align-items: center;
  justify-content: center;
  font-family: "Charter", Georgia, serif;
}

canvas {
  display: block;
  width: 100%;
  height: 100%;
}

/* The band: gallery · tools · name · hire me. Each word either links out or
   unfolds one row beneath it; one row open at a time. */
.ui {
  position: absolute;
  bottom: 36px;
  left: 0;
  right: 0;
  text-align: center;
  z-index: 100;
  font-family: -apple-system, "Segoe UI", sans-serif;
  font-size: 12px;
  letter-spacing: 0.22em;
  text-transform: uppercase;
  opacity: 0.55;
  transition: opacity 0.4s;
}
.ui:hover, .ui:focus-within, .ui.open { opacity: 1; }
.ui .row { display: flex; justify-content: center; align-items: baseline; gap: 28px; flex-wrap: wrap; padding: 0 16px; }
.ui .word {
  background: none; border: 0; padding: 0;
  font: inherit; letter-spacing: inherit; text-transform: inherit;
  color: #8a93a3; cursor: pointer; text-decoration: none;
  border-bottom: 1px solid transparent;
}
.ui .word:hover, .ui .word[aria-expanded="true"] { color: #e8eaec; border-bottom-color: #2b4a7a; }
.ui .name { color: #e8eaec; font-size: 14px; letter-spacing: 0.14em; min-width: 13ch; transition: opacity 0.65s; }
.ui .name.fade { opacity: 0; }
.ui .unfold { margin-top: 14px; display: flex; justify-content: center; align-items: baseline; gap: 22px; flex-wrap: wrap; padding: 0 16px; color: #8a93a3; }
.ui .unfold[hidden] { display: none; }
.ui .unfold a { color: #8cc9ff; text-decoration: none; border-bottom: 1px solid rgba(74, 158, 255, 0.25); }
.ui .unfold a:hover { color: #fff; }
.ui .addr { font-family: ui-monospace, Menlo, monospace; font-size: 11px; letter-spacing: 0.04em; text-transform: none; display: flex; gap: 18px; flex-wrap: wrap; justify-content: center; }
.ui .addr .chain { color: #4f5868; letter-spacing: 0.1em; margin-right: 6px; }
.ui .addr button { background: none; border: 0; padding: 0; font: inherit; color: #8a93a3; cursor: pointer; border-bottom: 1px dotted #4f5868; }
.ui .addr button:hover { color: #8cc9ff; }
.ui .addr .pending { color: #4f5868; font-style: italic; }
@media (max-width: 640px) {
  /* narrow: the name takes its own line above the three words */
  .ui { bottom: 28px; }
  .ui .row { gap: 22px; row-gap: 12px; }
  .ui .name { flex-basis: 100%; order: -1; min-width: 0; }
  .ui .unfold { gap: 14px 18px; }
}
</style>
</head>
<body>

<canvas id="canvas"></canvas>

<nav class="ui" id="ui" aria-label="site">
  <div class="row">
    <button class="word" type="button" data-unfold="gallery" aria-expanded="false" aria-controls="unfold-gallery">gallery</button>
    <a class="word" href="tools.html">tools</a>
    <span class="name" data-site="name" dir="auto">Pavel Vasilyev</span>
    <button class="word" type="button" data-unfold="hire" aria-expanded="false" aria-controls="unfold-hire">hire me</button>
  </div>
  <div class="unfold" id="unfold-gallery" hidden>
    <a href="gallery.html">open the gallery →</a>
    <div class="addr" title="support the art"></div>
  </div>
  <div class="unfold" id="unfold-hire" hidden>
    <a href="cv.html">cv</a>
    <a href="oracles.html">oracles · the working note</a>
    <a href="hire.html">hire me to tune AI for you</a>
    <a data-site="telegram"></a>
    <a data-site="email"></a>
  </div>
</nav>

<script>
// Landing background: a slow, seamless 8-second cinematic loop.
// Provenance — repo: marchdown.github.io (github.com/marchdown/marchdown.github.io),
// session: ~/.claude/projects/-Users-uprootiny-marchdown-github-io, job 0e536177, 2026-11-05.

const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');

// ---------------------------------------------------------------------------
// Loop clock. Every quantity that moves is a function of the phase φ ∈ [0, 2π)
// of one 8-second cycle, and every oscillation uses an integer harmonic of φ.
// render(φ) is therefore exactly periodic: the loop is seamless by
// construction, not by tuning. Check: render(0) and render(2π) are pixel-equal.
const PERIOD_MS = 8000;
const TAU = Math.PI * 2;

// Deterministic RNG (mulberry32): the composition is identical on every load.
function mulberry32(seed) {
  let a = seed >>> 0;
  return function () {
    a = (a + 0x6D2B79F5) >>> 0;
    let t = a;
    t = Math.imul(t ^ (t >>> 15), t | 1);
    t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
const rand = mulberry32(0x6d617263);
const gauss = () => (rand() + rand() + rand() - 1.5) / 1.5;  // bell-shaped on [-1, 1]
const pick = (arr) => arr[Math.floor(rand() * arr.length)];
const clamp01 = (v) => Math.min(1, Math.max(0, v));

// ---------------------------------------------------------------------------
// Scene, in a unit frame: lengths are fractions of min(viewport w, h).
// The structure sits slightly above centre so the lower band, where the name
// and link live, stays negative space.

const NODE_COUNT = 56;
const nodes = [];
for (let i = 0; i < NODE_COUNT; i++) {
  nodes.push({
    hx: gauss() * 0.44, hy: gauss() * 0.30 - 0.05, hz: gauss() * 0.40,
    r: 0.0025 + rand() * 0.004,
    bright: rand() < 0.3,
    // per-node drift: a tiny Lissajous at harmonics 1 or 2 with its own phases
    ax: 0.006 + rand() * 0.008, ay: 0.006 + rand() * 0.008, az: 0.006 + rand() * 0.008,
    kx: pick([1, 2]), ky: pick([1, 2]), kz: pick([1, 1, 2]),
    px: rand() * TAU, py: rand() * TAU, pz: rand() * TAU,
    gk: pick([1, 2]), gp: rand() * TAU,  // glow pulse: harmonic and phase
  });
}

// Filaments: each node to its two nearest neighbours (a web), plus a few long
// faint ties across the structure.
const edges = [];
const edgeKeys = new Set();
function addEdge(a, b, long) {
  if (a === b) return;
  const key = a < b ? `${a}:${b}` : `${b}:${a}`;
  if (edgeKeys.has(key)) return;
  edgeKeys.add(key);
  edges.push({
    a, b, long,
    k: pick([1, 2]), p: rand() * TAU,                      // filament pulse
    lit: rand() < 0.5, trips: pick([1, 1, 2]), tp: rand(),  // travelling light
  });
}
nodes.forEach((n, i) => {
  const near = nodes
    .map((m, j) => ({ j, d: (m.hx - n.hx) ** 2 + (m.hy - n.hy) ** 2 + (m.hz - n.hz) ** 2 }))
    .filter((o) => o.j !== i)
    .sort((p, q) => p.d - q.d);
  addEdge(i, near[0].j, false);
  addEdge(i, near[1].j, false);
});
for (let i = 0; i < 14; i++) {
  addEdge(Math.floor(rand() * NODE_COUNT), Math.floor(rand() * NODE_COUNT), true);
}

// ---------------------------------------------------------------------------
// The wrongness budget. A few things are slightly off, each too small to point
// at, all on the same clock so the loop still closes:
//   contrary  nodes whose parallax runs against the camera sway
//   counter   nodes that breathe against the rest
//   absent    nodes that, for a stretch of the loop, are not there
//   offhue    one node of a colour that does not belong
//   short     filaments that stop a varying hair before their node
//   ripple    the space itself, very faintly (in render)
nodes.forEach((n) => {
  n.contrary = rand() < 0.10;
  n.counter = rand() < 0.06;
  n.absent = rand() < 0.05 ? rand() * TAU : null;
  n.offhue = false;
});
nodes[Math.floor(rand() * NODE_COUNT)].offhue = true;
edges.forEach((e) => { e.short = rand() < 0.12 ? rand() * TAU : null; });

// Fine dust. Each mote has its own position in the loop: it fades in, drifts
// a few percent of the frame, fades out, and resets while invisible.
const PARTICLE_COUNT = 170;
const particles = [];
for (let i = 0; i < PARTICLE_COUNT; i++) {
  const ang = rand() * TAU;
  const spd = 0.015 + rand() * 0.03;  // fraction of the frame per loop
  particles.push({
    x: rand(), y: rand(),
    vx: Math.cos(ang) * spd, vy: Math.sin(ang) * spd - 0.01,  // slight updraft
    depth: 0.4 + rand() * 0.6,
    off: rand(),
  });
}

// ---------------------------------------------------------------------------
// Render one frame at phase φ. Pure in φ and the viewport size.

function render(phi) {
  const w = canvas.clientWidth, h = canvas.clientHeight;
  const unit = Math.min(w, h);
  const cx = w / 2, cy = h / 2;

  ctx.fillStyle = '#0a0e14';
  ctx.fillRect(0, 0, w, h);
  const bloom = ctx.createRadialGradient(cx, cy - 0.05 * unit, 0, cx, cy - 0.05 * unit, unit * 0.65);
  bloom.addColorStop(0, 'rgba(43, 74, 122, 0.10)');
  bloom.addColorStop(1, 'rgba(43, 74, 122, 0)');
  ctx.fillStyle = bloom;
  ctx.fillRect(0, 0, w, h);

  // Dust, behind everything.
  for (const p of particles) {
    const f = (phi / TAU + p.off) % 1;
    const env = Math.sin(Math.PI * f) ** 2;
    const x = (p.x + p.vx * (f - 0.5)) * w;
    const y = (p.y + p.vy * (f - 0.5)) * h;
    ctx.fillStyle = `rgba(140, 180, 230, ${(0.12 + 0.33 * p.depth) * env})`;
    ctx.beginPath();
    ctx.arc(x, y, 0.4 + p.depth * 0.9, 0, TAU);
    ctx.fill();
  }

  // Camera: a barely-there sway (≈1.5° yaw, ≈1° pitch) and a 1% dolly, once
  // per loop. The whole structure breathes once per loop as well.
  const yaw = 0.026 * Math.sin(phi);
  const pitch = 0.017 * Math.cos(phi);
  const camDist = 1.6 * (1 + 0.01 * Math.sin(phi + 0.9));
  const breath = 1 + 0.02 * Math.sin(phi + 0.4);
  const cosY = Math.cos(yaw), sinY = Math.sin(yaw);
  const cosX = Math.cos(pitch), sinX = Math.sin(pitch);

  const rip = 0.0025 * unit;  // the ripple in the space itself
  const proj = nodes.map((n) => {
    const br = n.counter ? 2 - breath : breath;
    const x = (n.hx + n.ax * Math.sin(n.kx * phi + n.px)) * br;
    const y = (n.hy + n.ay * Math.sin(n.ky * phi + n.py)) * br;
    const z = (n.hz + n.az * Math.sin(n.kz * phi + n.pz)) * br;
    const sY = n.contrary ? -sinY : sinY, sX = n.contrary ? -sinX : sinX;
    const x1 = x * cosY - z * sY, z1 = x * sY + z * cosY;
    const y1 = y * cosX - z1 * sX, z2 = y * sX + z1 * cosX;
    const s = camDist / (camDist + z2);
    let px = cx + x1 * s * unit, py = cy + y1 * s * unit;
    px += rip * Math.sin(((py - cy) / unit) * 9 + phi);
    py += rip * 0.6 * Math.sin(((px - cx) / unit) * 7 - phi);
    const vis = n.absent === null ? 1 : clamp01((0.5 + 0.5 * Math.cos(phi - n.absent) - 0.25) / 0.35);
    return { x: px, y: py, s, z: z2, vis };
  });
  const depthFade = (z) => 0.3 + 0.7 * clamp01(0.5 - z);

  // Filaments, then the light that travels along them.
  ctx.lineCap = 'round';
  const L = 0.18;  // half-length of a travelling light, as a fraction of its filament
  for (const e of edges) {
    const A = proj[e.a], B = proj[e.b];
    const fade = depthFade((A.z + B.z) / 2);
    const pulse = 0.5 + 0.5 * Math.sin(e.k * phi + e.p);
    const alpha = (e.long ? 0.035 + 0.03 * pulse : 0.09 + 0.07 * pulse) * fade
      * (0.5 + 0.5 * A.vis) * (0.5 + 0.5 * B.vis);
    let bx = B.x, by = B.y;
    if (e.short !== null) {
      const dx = B.x - A.x, dy = B.y - A.y, len = Math.hypot(dx, dy) || 1;
      const gap = (3 + 2 * Math.sin(phi + e.short)) * unit / 900;
      bx -= (dx / len) * gap;
      by -= (dy / len) * gap;
    }
    ctx.strokeStyle = `rgba(74, 158, 255, ${alpha})`;
    ctx.lineWidth = e.long ? 0.6 : 0.9;
    ctx.beginPath();
    ctx.moveTo(A.x, A.y);
    ctx.lineTo(bx, by);
    ctx.stroke();

    if (!e.lit) continue;
    // The light's centre runs from −L to 1+L, so it enters at one node and
    // leaves at the other without a pop, `trips` times per loop.
    const u = -L + (1 + 2 * L) * ((e.trips * phi / TAU + e.tp) % 1);
    const u0 = Math.max(0, u - L), u1 = Math.min(1, u + L);
    if (u1 <= u0) continue;
    const at = (v) => [A.x + (B.x - A.x) * v, A.y + (B.y - A.y) * v];
    const [x0, y0] = at(u0), [x1, y1] = at(u1);
    const amp = 0.45 * fade;
    const kernel = (v) => Math.max(0, 1 - Math.abs(v - u) / L);
    const g = ctx.createLinearGradient(x0, y0, x1, y1);
    g.addColorStop(0, `rgba(170, 215, 255, ${amp * kernel(u0)})`);
    if (u > u0 && u < u1) g.addColorStop((u - u0) / (u1 - u0), `rgba(170, 215, 255, ${amp})`);
    g.addColorStop(1, `rgba(170, 215, 255, ${amp * kernel(u1)})`);
    ctx.strokeStyle = g;
    ctx.lineWidth = 1.4;
    ctx.beginPath();
    ctx.moveTo(x0, y0);
    ctx.lineTo(x1, y1);
    ctx.stroke();
  }

  // Nodes, far to near. A broad band of light crosses the structure once per
  // loop (a plane wave in screen space), on top of each node's own slow glow.
  const order = proj.map((_, i) => i).sort((i, j) => proj[j].z - proj[i].z);
  for (const i of order) {
    const n = nodes[i], P = proj[i];
    const nx = (P.x - cx) / unit, ny = (P.y - cy) / unit;
    const sweep = 0.5 + 0.5 * Math.cos(phi - TAU * 0.7 * (nx * 0.8 + ny * 0.6));
    const glow = 0.5 + 0.5 * Math.sin(n.gk * phi + n.gp);
    if (P.vis <= 0) continue;
    const lum = depthFade(P.z) * (0.55 + 0.25 * glow + 0.2 * sweep) * P.vis;
    const r = n.r * unit * P.s;
    const rgb = n.offhue ? '201, 162, 214' : n.bright ? '140, 201, 255' : '74, 158, 255';
    const halo = ctx.createRadialGradient(P.x, P.y, 0, P.x, P.y, r * 5);
    halo.addColorStop(0, `rgba(${rgb}, ${0.35 * lum})`);
    halo.addColorStop(1, `rgba(${rgb}, 0)`);
    ctx.fillStyle = halo;
    ctx.beginPath();
    ctx.arc(P.x, P.y, r * 5, 0, TAU);
    ctx.fill();
    ctx.fillStyle = `rgba(${rgb}, ${(0.55 + 0.45 * lum) * P.vis})`;
    ctx.beginPath();
    ctx.arc(P.x, P.y, r, 0, TAU);
    ctx.fill();
  }
}

// ---------------------------------------------------------------------------
// Clock and sizing. Time-based, so the period is 8 s at any refresh rate.
// Under prefers-reduced-motion the page shows a single still frame.

function resize() {
  const dpr = Math.min(2, window.devicePixelRatio || 1);
  canvas.width = Math.round(canvas.clientWidth * dpr);
  canvas.height = Math.round(canvas.clientHeight * dpr);
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}

const stillOnly = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
const t0 = performance.now();
function frame(now) {
  render((((now - t0) % PERIOD_MS) / PERIOD_MS) * TAU);
  requestAnimationFrame(frame);
}

window.addEventListener('resize', () => { resize(); if (stillOnly) render(0); });
resize();
if (stillOnly) render(0); else requestAnimationFrame(frame);

// Exposed for the seam check (see JOURNAL.md): render(0) must equal render(TAU).
window.__loop = { render, PERIOD_MS, TAU };
</script>
<script src="site.js"></script>
<script src="feed.js"></script>
<script>
// The band. One unfolded row at a time; the name drifts through its scripts.
(function band() {
  const ui = document.getElementById('ui');
  const toggles = ui.querySelectorAll('[data-unfold]');
  toggles.forEach((b) => {
    b.addEventListener('click', () => {
      const open = b.getAttribute('aria-expanded') !== 'true';
      toggles.forEach((o) => {
        o.setAttribute('aria-expanded', 'false');
        document.getElementById('unfold-' + o.dataset.unfold).hidden = true;
      });
      if (open) {
        b.setAttribute('aria-expanded', 'true');
        document.getElementById('unfold-' + b.dataset.unfold).hidden = false;
      }
      ui.classList.toggle('open', open);
    });
  });

  const nameEl = ui.querySelector('.name');
  const cycle = SITE.nameCycle.filter((k) => SITE.name[k]);
  nameEl.textContent = SITE.name[cycle[0] || 'en'];
  if (cycle.length > 1 && !stillOnly) {
    let i = 0;
    setInterval(() => {
      nameEl.classList.add('fade');
      setTimeout(() => {
        i = (i + 1) % cycle.length;
        nameEl.textContent = SITE.name[cycle[i]];
        nameEl.classList.remove('fade');
      }, 650);
    }, 12000);
  }
})();
</script>
