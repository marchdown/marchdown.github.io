<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pavel Vasilyev</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }

body {
  width: 100vw;
  height: 100vh;
  overflow: hidden;
  background: #0a0e14;
  display: flex;
  align-items: center;
  justify-content: center;
  font-family: "Charter", Georgia, serif;
}

canvas {
  display: block;
  width: 100%;
  height: 100%;
}

.ui {
  position: absolute;
  bottom: 40px;
  left: 50%;
  transform: translateX(-50%);
  text-align: center;
  z-index: 100;
  opacity: 0.5;
  transition: opacity 0.3s;
}

.ui:hover {
  opacity: 1;
}

.ui-text {
  font-size: 14px;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  color: #e8eaec;
  margin-bottom: 12px;
  font-family: -apple-system, "Segoe UI", sans-serif;
}

.ui-link {
  display: inline-block;
  color: #2b4a7a;
  text-decoration: none;
  font-size: 14px;
  padding: 8px 16px;
  border: 1px solid #2b4a7a;
  border-radius: 3px;
  transition: all 0.2s;
}

.ui-link:hover {
  background: #2b4a7a;
  color: #0a0e14;
}
</style>
</head>
<body>

<canvas id="canvas"></canvas>

<div class="ui">
  <div class="ui-text">Pavel Vasilyev</div>
  <a href="drafts/index-cv.html" class="ui-link">View CV Editions</a>
</div>

<script>
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');

canvas.width = window.innerWidth;
canvas.height = window.innerHeight;

// Generate a hypergraph structure
class HyperGraph {
  constructor() {
    this.nodes = [];
    this.edges = [];
    this.generateGraph();
  }

  generateGraph() {
    // Create 40 nodes in 3D space
    for (let i = 0; i < 40; i++) {
      this.nodes.push({
        x: (Math.random() - 0.5) * 800,
        y: (Math.random() - 0.5) * 800,
        z: (Math.random() - 0.5) * 800,
        radius: 2 + Math.random() * 4,
        color: Math.random() > 0.7 ? '#8cc9ff' : '#4a9eff',
      });
    }

    // Create hyperedges (each connects 2-4 nodes)
    for (let i = 0; i < 60; i++) {
      const edgeSize = 2 + Math.floor(Math.random() * 3);
      const edge = [];
      for (let j = 0; j < edgeSize; j++) {
        edge.push(Math.floor(Math.random() * this.nodes.length));
      }
      this.edges.push(edge);
    }
  }

  project(node, camDist) {
    // Simple 3D perspective projection
    const scale = camDist / (camDist + node.z);
    return {
      x: node.x * scale,
      y: node.y * scale,
      z: node.z,
      scale: scale,
      radius: node.radius * scale,
      color: node.color,
    };
  }
}

const graph = new HyperGraph();
let time = 0;
const camDistance = 500;

function rotatePoint(p, angleX, angleY, angleZ) {
  let x = p.x, y = p.y, z = p.z;

  // Rotate around Y
  let cosY = Math.cos(angleY);
  let sinY = Math.sin(angleY);
  let x1 = x * cosY - z * sinY;
  let z1 = x * sinY + z * cosY;

  // Rotate around X
  let cosX = Math.cos(angleX);
  let sinX = Math.sin(angleX);
  let y1 = y * cosX - z1 * sinX;
  let z2 = y * sinX + z1 * cosX;

  return { x: x1, y: y1, z: z2 };
}

function animate() {
  time += 0.008;

  // Clear background
  ctx.fillStyle = '#0a0e14';
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  // Camera tumble angles
  const angleX = time * 0.3;
  const angleY = time * 0.5;
  const angleZ = time * 0.2;

  // Transform and project nodes
  const projected = graph.nodes.map((node) => {
    const rotated = rotatePoint(node, angleX, angleY, angleZ);
    return graph.project(rotated, camDistance);
  });

  // Sort by depth (painter's algorithm)
  const sortedIndices = graph.nodes.map((_, i) => i);
  sortedIndices.sort((a, b) => projected[a].z - projected[b].z);

  // Draw edges first (so they appear behind nodes)
  ctx.strokeStyle = 'rgba(74, 158, 255, 0.08)';
  ctx.lineWidth = 1;
  graph.edges.forEach((edge) => {
    for (let i = 0; i < edge.length - 1; i++) {
      const p1 = projected[edge[i]];
      const p2 = projected[edge[i + 1]];
      ctx.beginPath();
      ctx.moveTo(canvas.width / 2 + p1.x, canvas.height / 2 + p1.y);
      ctx.lineTo(canvas.width / 2 + p2.x, canvas.height / 2 + p2.y);
      ctx.stroke();
    }
  });

  // Draw nodes
  sortedIndices.forEach((idx) => {
    const p = projected[idx];
    if (p.scale > 0.05) {
      // Glow effect
      const gradient = ctx.createRadialGradient(
        canvas.width / 2 + p.x, canvas.height / 2 + p.y, 0,
        canvas.width / 2 + p.x, canvas.height / 2 + p.y, p.radius * 3
      );
      gradient.addColorStop(0, p.color.replace(')', ', 0.6)').replace(/rgb/, 'rgba'));
      gradient.addColorStop(1, p.color.replace(')', ', 0)').replace(/rgb/, 'rgba'));

      ctx.fillStyle = gradient;
      ctx.beginPath();
      ctx.arc(canvas.width / 2 + p.x, canvas.height / 2 + p.y, p.radius * 3, 0, Math.PI * 2);
      ctx.fill();

      // Core
      ctx.fillStyle = p.color;
      ctx.beginPath();
      ctx.arc(canvas.width / 2 + p.x, canvas.height / 2 + p.y, p.radius, 0, Math.PI * 2);
      ctx.fill();
    }
  });

  requestAnimationFrame(animate);
}

window.addEventListener('resize', () => {
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
});

animate();
</script>

</body>
</html>
