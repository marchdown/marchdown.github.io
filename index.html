<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Pavel Vasilyev — marchdown</title>
  <style>
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background: #0a0c0f;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      overflow: hidden;
    }
    canvas {
      display: block;
      width: 100%;
      height: 100%;
    }
    .overlay {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 40px;
      pointer-events: none;
      z-index: 10;
    }
    header {
      text-align: left;
    }
    h1 {
      margin: 0 0 6px 0;
      font-size: 28px;
      font-weight: 300;
      letter-spacing: 0.5px;
      color: #e8e6e1;
    }
    .subtitle {
      font-size: 14px;
      color: #8a8885;
      font-weight: 300;
      letter-spacing: 0.3px;
    }
    footer {
      display: flex;
      gap: 28px;
      align-items: flex-end;
      flex-wrap: wrap;
    }
    .links {
      display: flex;
      gap: 18px;
      font-size: 13px;
    }
    a {
      color: #a9a5a0;
      text-decoration: none;
      border-bottom: 1px solid transparent;
      transition: all 0.3s ease;
      pointer-events: auto;
    }
    a:hover {
      color: #d8d4cc;
      border-bottom-color: #d8d4cc;
    }
    .status {
      font-size: 12px;
      color: #6a6865;
      display: flex;
      gap: 10px;
      align-items: center;
    }
    .dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #9a8a6a;
      animation: pulse 2s ease-in-out infinite;
    }
    @keyframes pulse {
      0%, 100% { opacity: 0.5; }
      50% { opacity: 1; }
    }
    @media (max-width: 640px) {
      .overlay { padding: 24px; }
      h1 { font-size: 22px; }
      .links { flex-direction: column; gap: 8px; }
      footer { flex-direction: column; gap: 14px; }
    }
  </style>
</head>
<body>
  <canvas id="canvas"></canvas>

  <div class="overlay">
    <header>
      <h1>Pavel Vasilyev</h1>
      <p class="subtitle">LLM verification architect · software engineer</p>
    </header>

    <footer>
      <div class="links">
        <a href="https://github.com/marchdown">github</a>
        <a href="https://hyperstitious.org">blog</a>
        <a href="mailto:uprootiny@gmail.com">email</a>
        <a href="/drafts/cv.html">cv</a>
      </div>
      <div class="status">
        <span class="dot"></span>
        <span>open to fractional work</span>
      </div>
    </footer>
  </div>

  <script>
    // Generative tree growth visualization
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');

    function resizeCanvas() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }
    resizeCanvas();
    window.addEventListener('resize', resizeCanvas);

    // Tree generation using simple recursion
    class TreeGrower {
      constructor() {
        this.trees = [];
        this.time = 0;
        this.maxGrowthTime = 180; // seconds to full growth
        this.initTrees();
      }

      initTrees() {
        const count = Math.max(2, Math.floor(window.innerWidth / 400));
        for (let i = 0; i < count; i++) {
          this.trees.push({
            x: (i + 0.5) * (window.innerWidth / count),
            y: window.innerHeight - 40,
            age: Math.random() * 40, // stagger growth
            branches: []
          });
        }
      }

      growTree(tree) {
        const progress = Math.min(1, tree.age / this.maxGrowthTime);
        this.generateBranches(tree, tree.x, tree.y, 90, 8, 0, progress);
      }

      generateBranches(tree, x, y, angle, length, depth, progress) {
        if (depth > 7) return;
        if (length < 1) return;

        // Limit growth based on progress
        const depthLimit = Math.floor(progress * 8);
        if (depth > depthLimit) return;

        const x2 = x + length * Math.cos((angle - 90) * Math.PI / 180);
        const y2 = y + length * Math.sin((angle - 90) * Math.PI / 180);

        tree.branches.push({ x, y, x2, y2, depth });

        const angleVariation = 25;
        const lengthReduce = 0.7;

        this.generateBranches(tree, x2, y2, angle - angleVariation, length * lengthReduce, depth + 1, progress);
        this.generateBranches(tree, x2, y2, angle + angleVariation, length * lengthReduce, depth + 1, progress);
      }

      draw() {
        ctx.fillStyle = '#0a0c0f';
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        // Draw starfield
        ctx.fillStyle = 'rgba(150, 140, 130, 0.15)';
        for (let i = 0; i < 100; i++) {
          const x = (i * 73 + this.time * 0.3) % canvas.width;
          const y = (i * 127) % canvas.height;
          const size = 0.5 + (i % 3) * 0.3;
          ctx.fillRect(x, y, size, size);
        }

        // Draw trees
        for (let tree of this.trees) {
          tree.branches = [];
          this.growTree(tree);

          for (let branch of tree.branches) {
            const depth = branch.depth;
            const opacity = 0.3 + (1 - depth / 8) * 0.5;
            const width = Math.max(0.5, 3 - depth * 0.35);

            ctx.strokeStyle = `rgba(169, 165, 160, ${opacity})`;
            ctx.lineWidth = width;
            ctx.lineCap = 'round';
            ctx.lineJoin = 'round';

            ctx.beginPath();
            ctx.moveTo(branch.x, branch.y);
            ctx.lineTo(branch.x2, branch.y2);
            ctx.stroke();
          }
        }
      }

      update(deltaTime) {
        this.time += deltaTime;
        for (let tree of this.trees) {
          tree.age += deltaTime;
        }
      }
    }

    const grower = new TreeGrower();
    let lastTime = performance.now();

    function animate() {
      const now = performance.now();
      const deltaTime = (now - lastTime) / 1000;
      lastTime = now;

      grower.update(deltaTime * 0.5); // slow growth
      grower.draw();

      requestAnimationFrame(animate);
    }

    animate();
  </script>
</body>
</html>
