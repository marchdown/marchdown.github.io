<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pavel Vasilyev</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }

body {
  width: 100vw;
  height: 100vh;
  overflow: hidden;
  background: #0a0e14;
  display: flex;
  align-items: center;
  justify-content: center;
  font-family: "Charter", Georgia, serif;
  color: #e8eaec;
}

.viewport {
  position: relative;
  width: 100%;
  height: 100%;
  overflow: hidden;
}

svg {
  position: absolute;
  width: 100%;
  height: 100%;
  top: 0;
  left: 0;
}

/* ---- Zoom animation sequence ---- */
@keyframes zoom-1 {
  0% {
    transform: translate(0, 0) scale(1);
    opacity: 1;
  }
  85% {
    opacity: 1;
  }
  100% {
    transform: translate(-25%, -25%) scale(4);
    opacity: 0;
  }
}

@keyframes zoom-2 {
  0% {
    transform: translate(25%, 25%) scale(0.25);
    opacity: 0;
  }
  15% {
    opacity: 1;
  }
  85% {
    opacity: 1;
  }
  100% {
    transform: translate(0%, -30%) scale(3.5);
    opacity: 0;
  }
}

@keyframes zoom-3 {
  0% {
    transform: translate(0%, 30%) scale(0.286);
    opacity: 0;
  }
  15% {
    opacity: 1;
  }
  85% {
    opacity: 1;
  }
  100% {
    transform: translate(20%, 20%) scale(4);
    opacity: 0;
  }
}

@keyframes zoom-4 {
  0% {
    transform: translate(-20%, -20%) scale(0.25);
    opacity: 0;
  }
  15% {
    opacity: 1;
  }
  100% {
    transform: translate(0, 0) scale(1);
    opacity: 1;
  }
}

.scene {
  position: absolute;
  width: 100%;
  height: 100%;
  top: 0;
  left: 0;
}

.scene:nth-child(1) {
  animation: zoom-1 16s infinite;
}

.scene:nth-child(2) {
  animation: zoom-2 16s infinite;
}

.scene:nth-child(3) {
  animation: zoom-3 16s infinite;
}

.scene:nth-child(4) {
  animation: zoom-4 16s infinite;
}

/* ---- UI overlay ---- */
.ui {
  position: absolute;
  bottom: 40px;
  left: 50%;
  transform: translateX(-50%);
  text-align: center;
  z-index: 100;
  opacity: 0.6;
  transition: opacity 0.3s;
}

.ui:hover {
  opacity: 1;
}

.ui-text {
  font-size: 14px;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  margin-bottom: 12px;
  font-family: -apple-system, "Segoe UI", sans-serif;
}

.ui-link {
  display: inline-block;
  color: #2b4a7a;
  text-decoration: none;
  font-size: 14px;
  padding: 8px 16px;
  border: 1px solid #2b4a7a;
  border-radius: 3px;
  transition: all 0.2s;
}

.ui-link:hover {
  background: #2b4a7a;
  color: #0a0e14;
}

/* ---- Responsive ---- */
@media (max-width: 800px) {
  .ui-text {
    font-size: 12px;
  }
  .ui-link {
    font-size: 12px;
    padding: 6px 12px;
  }
}
</style>
</head>
<body>

<div class="viewport">
  <!-- Scene 1: Sparse constellation -->
  <div class="scene">
    <svg viewBox="0 0 1000 1000">
      <defs>
        <radialGradient id="glow1" cx="50%" cy="50%" r="50%">
          <stop offset="0%" style="stop-color:#4a9eff;stop-opacity:0.8" />
          <stop offset="100%" style="stop-color:#2b5aaa;stop-opacity:0" />
        </radialGradient>
      </defs>
      <rect width="1000" height="1000" fill="#0a0e14"/>
      <!-- Large focal point -->
      <circle cx="300" cy="300" r="60" fill="url(#glow1)" opacity="0.9"/>
      <!-- Surrounding points -->
      <circle cx="150" cy="200" r="8" fill="#4a9eff" opacity="0.6"/>
      <circle cx="450" cy="250" r="6" fill="#4a9eff" opacity="0.5"/>
      <circle cx="200" cy="500" r="7" fill="#4a9eff" opacity="0.4"/>
      <circle cx="600" cy="400" r="5" fill="#4a9eff" opacity="0.3"/>
      <circle cx="400" cy="700" r="9" fill="#4a9eff" opacity="0.5"/>
      <circle cx="800" cy="300" r="4" fill="#4a9eff" opacity="0.2"/>
      <!-- Connecting threads -->
      <line x1="300" y1="300" x2="150" y2="200" stroke="#4a9eff" stroke-width="1" opacity="0.2"/>
      <line x1="300" y1="300" x2="450" y2="250" stroke="#4a9eff" stroke-width="1" opacity="0.2"/>
      <line x1="300" y1="300" x2="400" y2="700" stroke="#4a9eff" stroke-width="1" opacity="0.15"/>
    </svg>
  </div>

  <!-- Scene 2: Zoomed detail becomes new constellation -->
  <div class="scene">
    <svg viewBox="0 0 1000 1000">
      <rect width="1000" height="1000" fill="#0c1220"/>
      <!-- New pattern at zoom level -->
      <circle cx="600" cy="400" r="70" fill="url(#glow1)" opacity="0.85"/>
      <circle cx="400" cy="300" r="8" fill="#6bb3ff" opacity="0.7"/>
      <circle cx="800" cy="350" r="7" fill="#6bb3ff" opacity="0.6"/>
      <circle cx="500" cy="600" r="9" fill="#6bb3ff" opacity="0.5"/>
      <circle cx="750" cy="650" r="6" fill="#6bb3ff" opacity="0.4"/>
      <circle cx="300" cy="450" r="5" fill="#6bb3ff" opacity="0.3"/>
      <line x1="600" y1="400" x2="400" y2="300" stroke="#6bb3ff" stroke-width="1" opacity="0.2"/>
      <line x1="600" y1="400" x2="500" y2="600" stroke="#6bb3ff" stroke-width="1" opacity="0.15"/>
    </svg>
  </div>

  <!-- Scene 3: Another zoom layer -->
  <div class="scene">
    <svg viewBox="0 0 1000 1000">
      <rect width="1000" height="1000" fill="#11131f"/>
      <circle cx="350" cy="350" r="80" fill="url(#glow1)" opacity="0.8"/>
      <circle cx="150" cy="250" r="9" fill="#8cc9ff" opacity="0.75"/>
      <circle cx="550" cy="300" r="8" fill="#8cc9ff" opacity="0.65"/>
      <circle cx="300" cy="650" r="10" fill="#8cc9ff" opacity="0.55"/>
      <circle cx="700" cy="500" r="7" fill="#8cc9ff" opacity="0.4"/>
      <circle cx="450" cy="450" r="6" fill="#8cc9ff" opacity="0.35"/>
      <circle cx="250" cy="150" r="5" fill="#8cc9ff" opacity="0.25"/>
      <line x1="350" y1="350" x2="150" y2="250" stroke="#8cc9ff" stroke-width="1" opacity="0.18"/>
      <line x1="350" y1="350" x2="700" y2="500" stroke="#8cc9ff" stroke-width="1" opacity="0.12"/>
      <line x1="350" y1="350" x2="300" y2="650" stroke="#8cc9ff" stroke-width="1" opacity="0.1"/>
    </svg>
  </div>

  <!-- Scene 4: Return to start -->
  <div class="scene">
    <svg viewBox="0 0 1000 1000">
      <rect width="1000" height="1000" fill="#0a0e14"/>
      <circle cx="300" cy="300" r="60" fill="url(#glow1)" opacity="0.9"/>
      <circle cx="150" cy="200" r="8" fill="#4a9eff" opacity="0.6"/>
      <circle cx="450" cy="250" r="6" fill="#4a9eff" opacity="0.5"/>
      <circle cx="200" cy="500" r="7" fill="#4a9eff" opacity="0.4"/>
      <circle cx="600" cy="400" r="5" fill="#4a9eff" opacity="0.3"/>
      <circle cx="400" cy="700" r="9" fill="#4a9eff" opacity="0.5"/>
      <circle cx="800" cy="300" r="4" fill="#4a9eff" opacity="0.2"/>
      <line x1="300" y1="300" x2="150" y2="200" stroke="#4a9eff" stroke-width="1" opacity="0.2"/>
      <line x1="300" y1="300" x2="450" y2="250" stroke="#4a9eff" stroke-width="1" opacity="0.2"/>
      <line x1="300" y1="300" x2="400" y2="700" stroke="#4a9eff" stroke-width="1" opacity="0.15"/>
    </svg>
  </div>
</div>

<div class="ui">
  <div class="ui-text">Pavel Vasilyev</div>
  <a href="drafts/index-cv.html" class="ui-link">View CV Editions</a>
</div>

</body>
</html>
