<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pavel Vasilyev</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }

body {
  width: 100vw;
  height: 100vh;
  overflow: hidden;
  background: #0a0e14;
  display: flex;
  align-items: center;
  justify-content: center;
  font-family: "Charter", Georgia, serif;
}

canvas {
  display: block;
  width: 100%;
  height: 100%;
}

.ui {
  position: absolute;
  bottom: 40px;
  left: 50%;
  transform: translateX(-50%);
  text-align: center;
  z-index: 100;
  opacity: 0.5;
  transition: opacity 0.3s;
}

.ui:hover {
  opacity: 1;
}

.ui-text {
  font-size: 14px;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  color: #e8eaec;
  margin-bottom: 12px;
  font-family: -apple-system, "Segoe UI", sans-serif;
}

.ui-link {
  display: inline-block;
  color: #2b4a7a;
  text-decoration: none;
  font-size: 14px;
  padding: 8px 16px;
  border: 1px solid #2b4a7a;
  border-radius: 3px;
  transition: all 0.2s;
}

.ui-link:hover {
  background: #2b4a7a;
  color: #0a0e14;
}
</style>
</head>
<body>

<canvas id="canvas"></canvas>

<div class="ui">
  <div class="ui-text">Pavel Vasilyev</div>
  <a href="drafts/index-cv.html" class="ui-link">View CV Editions</a>
</div>

<script>
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');

canvas.width = window.innerWidth;
canvas.height = window.innerHeight;

// Scene generator: returns array of points for a given seed/scale
function generateScene(seed, scale) {
  const random = (s) => {
    const x = Math.sin(s) * 10000;
    return x - Math.floor(x);
  };

  const points = [];
  const count = 12;

  for (let i = 0; i < count; i++) {
    const angle = (i / count) * Math.PI * 2;
    const r = 150 + random(seed + i) * 150;
    const x = 500 + Math.cos(angle) * r;
    const y = 500 + Math.sin(angle) * r;
    const size = 3 + random(seed + i * 1.5) * 8;

    points.push({
      x: x,
      y: y,
      size: size,
      opacity: 0.3 + random(seed + i * 2) * 0.5,
    });
  }

  // Central glow point
  points.push({
    x: 500,
    y: 500,
    size: 60,
    opacity: 0.8,
    isCenter: true,
  });

  return points;
}

let time = 0;
const cycleDuration = 16; // seconds

function drawScene(points, offsetX = 0, offsetY = 0, scale = 1, alpha = 1) {
  const centerX = canvas.width / 2;
  const centerY = canvas.height / 2;

  points.forEach((point) => {
    const x = centerX + (point.x - 500) * scale + offsetX;
    const y = centerY + (point.y - 500) * scale + offsetY;

    if (point.isCenter) {
      // Center glow
      const gradient = ctx.createRadialGradient(x, y, 0, x, y, point.size * scale);
      gradient.addColorStop(0, `rgba(74, 158, 255, ${point.opacity * alpha * 0.8})`);
      gradient.addColorStop(1, `rgba(43, 90, 170, 0)`);
      ctx.fillStyle = gradient;
      ctx.beginPath();
      ctx.arc(x, y, point.size * scale, 0, Math.PI * 2);
      ctx.fill();
    } else {
      // Points
      ctx.fillStyle = `rgba(74, 158, 255, ${point.opacity * alpha})`;
      ctx.beginPath();
      ctx.arc(x, y, point.size * scale, 0, Math.PI * 2);
      ctx.fill();
    }
  });

  // Connecting lines (subtle)
  ctx.strokeStyle = `rgba(74, 158, 255, ${0.1 * alpha})`;
  ctx.lineWidth = 1;
  for (let i = 0; i < points.length - 1; i++) {
    if (!points[i].isCenter) {
      const x1 = centerX + (points[i].x - 500) * scale + offsetX;
      const y1 = centerY + (points[i].y - 500) * scale + offsetY;
      const x2 = centerX + (500 - 500) * scale + offsetX;
      const y2 = centerY + (500 - 500) * scale + offsetY;
      ctx.beginPath();
      ctx.moveTo(x1, y1);
      ctx.lineTo(x2, y2);
      ctx.stroke();
    }
  }
}

function animate() {
  time += 0.016; // ~60fps
  const progress = (time % cycleDuration) / cycleDuration;

  // Clear background
  ctx.fillStyle = '#0a0e14';
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  // Zoom in phase (0 to 0.75)
  if (progress < 0.75) {
    const zoomProgress = progress / 0.75;
    const scale = 1 + zoomProgress * 3;
    const offsetX = (zoomProgress * -100);
    const offsetY = (zoomProgress * -100);
    const alpha = 1 - zoomProgress * 0.3;

    const scene = generateScene(1, scale);
    drawScene(scene, offsetX, offsetY, 1 / scale, alpha);
  }
  // Transition phase (0.75 to 0.85) - fade and reset
  else if (progress < 0.85) {
    const transitionProgress = (progress - 0.75) / 0.1;
    const alpha = 1 - transitionProgress;

    const scene = generateScene(1, 4);
    drawScene(scene, -300, -300, 0.25, alpha);
  }
  // Reset phase (0.85 to 1.0) - fade in new scene
  else {
    const resetProgress = (progress - 0.85) / 0.15;
    const alpha = resetProgress;

    const scene = generateScene(1, 1);
    drawScene(scene, 0, 0, 1, alpha);
  }

  requestAnimationFrame(animate);
}

// Handle window resize
window.addEventListener('resize', () => {
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
});

animate();
</script>

</body>
</html>
