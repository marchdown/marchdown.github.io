<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Pavel Vasilyev — marchdown</title>
  <style>
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background: #0a0c0f;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      overflow: hidden;
    }
    canvas {
      display: block;
      width: 100%;
      height: 100%;
    }
    .overlay {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 40px;
      pointer-events: none;
      z-index: 10;
    }
    header {
      text-align: left;
    }
    h1 {
      margin: 0 0 6px 0;
      font-size: 28px;
      font-weight: 300;
      letter-spacing: 0.5px;
      color: #e8e6e1;
    }
    .subtitle {
      font-size: 14px;
      color: #8a8885;
      font-weight: 300;
      letter-spacing: 0.3px;
    }
    footer {
      display: flex;
      gap: 28px;
      align-items: flex-end;
      flex-wrap: wrap;
    }
    .links {
      display: flex;
      gap: 18px;
      font-size: 13px;
    }
    a {
      color: #a9a5a0;
      text-decoration: none;
      border-bottom: 1px solid transparent;
      transition: all 0.3s ease;
      pointer-events: auto;
    }
    a:hover {
      color: #d8d4cc;
      border-bottom-color: #d8d4cc;
    }
    .status {
      font-size: 12px;
      color: #6a6865;
      display: flex;
      gap: 10px;
      align-items: center;
    }
    .dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #9a8a6a;
      animation: pulse 2s ease-in-out infinite;
    }
    @keyframes pulse {
      0%, 100% { opacity: 0.5; }
      50% { opacity: 1; }
    }
    @media (max-width: 640px) {
      .overlay { padding: 24px; }
      h1 { font-size: 22px; }
      .links { flex-direction: column; gap: 8px; }
      footer { flex-direction: column; gap: 14px; }
    }
  </style>
</head>
<body>
  <canvas id="canvas"></canvas>

  <div class="overlay">
    <header>
      <h1>Pavel Vasilyev</h1>
      <p class="subtitle">LLM verification architect · software engineer</p>
    </header>

    <footer>
      <div class="links">
        <a href="https://github.com/marchdown">github</a>
        <a href="https://hyperstitious.org">blog</a>
        <a href="mailto:uprootiny@gmail.com">email</a>
        <a href="https://cv.hyperstitious.art">cv</a>
      </div>
      <div class="status">
        <span class="dot"></span>
        <span>open to fractional work</span>
      </div>
    </footer>
  </div>

  <script>
    // Generative cityscape visualization
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d', { alpha: false });

    function resizeCanvas() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }
    resizeCanvas();
    window.addEventListener('resize', resizeCanvas);

    class Cityscape {
      constructor() {
        this.time = 0;
        this.buildings = [];
        this.generateBuildings();
      }

      generateBuildings() {
        const blockWidth = 60;
        const blockHeight = 80;
        const cols = Math.ceil(canvas.width / blockWidth) + 2;
        const rows = Math.ceil(canvas.height / blockHeight) + 2;

        for (let i = 0; i < cols; i++) {
          for (let j = 0; j < rows; j++) {
            const seed = (i * 73856093) ^ (j * 19349663);
            const hash = Math.abs(Math.sin(seed) * 10000) % 1;

            this.buildings.push({
              x: i * blockWidth,
              y: j * blockHeight,
              w: blockWidth - 2,
              h: blockHeight - 2,
              height: 40 + hash * 120,
              seed: hash,
              age: Math.random() * 120
            });
          }
        }
      }

      draw() {
        // Clean dark background
        ctx.fillStyle = '#0a0c0f';
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        // Draw buildings with growth animation
        for (let b of this.buildings) {
          const progress = Math.min(1, (b.age + this.time) / 80);
          const displayHeight = b.height * progress;
          const displayY = b.y + b.h - displayHeight;

          // Building body
          ctx.fillStyle = `rgba(${80 + b.seed * 40}, ${85 + b.seed * 35}, ${90 + b.seed * 40}, 0.85)`;
          ctx.fillRect(b.x, displayY, b.w, displayHeight);

          // Building outline
          ctx.strokeStyle = `rgba(140, 135, 130, 0.6)`;
          ctx.lineWidth = 1;
          ctx.strokeRect(b.x, displayY, b.w, displayHeight);

          // Windows - procedural based on height
          const windowSpacing = 8;
          const windowSize = 5;
          ctx.fillStyle = `rgba(255, 240, 200, ${0.3 + b.seed * 0.6})`;

          for (let wy = displayY + 6; wy < displayY + displayHeight; wy += windowSpacing) {
            for (let wx = b.x + 4; wx < b.x + b.w; wx += windowSpacing) {
              ctx.fillRect(wx, wy, windowSize, windowSize);
            }
          }
        }

        // Subtle horizon glow
        const gradient = ctx.createLinearGradient(0, canvas.height * 0.3, 0, canvas.height);
        gradient.addColorStop(0, 'rgba(10, 12, 15, 0)');
        gradient.addColorStop(1, 'rgba(20, 18, 15, 0.15)');
        ctx.fillStyle = gradient;
        ctx.fillRect(0, 0, canvas.width, canvas.height);
      }

      update(deltaTime) {
        this.time += deltaTime;
      }
    }

    const city = new Cityscape();
    let lastTime = performance.now();

    function animate() {
      const now = performance.now();
      const deltaTime = (now - lastTime) / 1000;
      lastTime = now;

      city.update(deltaTime * 0.3);
      city.draw();

      requestAnimationFrame(animate);
    }

    animate();
  </script>
</body>
</html>
